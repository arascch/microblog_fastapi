<html>
    <body>
        <h1>Global Microblog Feed </h1>
        <form action="/create" method="post" style="margin: 10px; padding: 10px; border: 1px solid black;">
            <h3>write a new post</h3>
            <input type="number" name="user_id" placeholder="Your User ID" required>
            <br><br>
            <input type="text" name="content" placeholder="whats on your mind?" required>
            <br><br>
            <button type="submit">Post</button>
        </form>
        {% for post in posts %}
            <div style="border: 1px solid gray; margin: 10px; padding: 10px;">
                <p>{{post.content}}</p>
                <small>Written by User : {{ post.user_id }}</small>
            </div>
        {%endfor%}
    </body>
</html>
